services:
  db:
    image: docker.io/library/postgres:17
    environment:
      - POSTGRES_DB=dh-scrapers
      - POSTGRES_USER=dh-scrapers
      - POSTGRES_PASSWORD=dh-scrapers
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=dh-scrapers
      - PGDATABASE=dh-scrapers
      - PGPASSWORD=dh-scrapers
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.3
    environment:
      - node.name=dhscrapers-node
      - discovery.type=single-node
      - cluster.name=dhscrapers-cluster
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - logger.org.elasticsearch.discovery=ERROR
      - logger.org.elasticsearch.transport=ERROR
      - logger.org.elasticsearch.http=ERROR
      - logger.org.elasticsearch.cluster=ERROR
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - ELASTIC_PASSWORD=dontuseinproduction
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 127.0.0.1:9200:9200

  
  iis-harvest:
    image: ghcr.io/centrefordigitalhumanities/dh-scrapers:latest
    user: "1000:0" # need this to check rootless
    volumes:
      - type: bind
        source: ./volumes/iis-metadata
        target: /harvest-metadata
      - type: bind
        source: ./volumes/epidoc
        target: /epidoc
      - type: bind
        source: ./volumes/iis-files
        target: /iis-files
    command: sh ./scripts/iis-export-newest.sh
  
  iis-parse:
    image: ghcr.io/centrefordigitalhumanities/dh-scrapers:latest
    user: "1000:0" # need this to check rootless
    depends_on:
      iis-harvest:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./volumes/iis-metadata
        target: /harvest-metadata
      - type: bind
        source: ./volumes/iis-files
        target: /iis-files
      - type: bind
        source: ./volumes/iis-output
        target: /output
    stdin_open: true
    tty: true
    command: python -m iis --import_folder /iis-files/originals --export_folder /output

  iis-prepare-postprocess:
    image: ghcr.io/centrefordigitalhumanities/dh-scrapers:latest
    depends_on:
      iis-parse:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./volumes/iis-output
        target: /output
      - type: bind
        source: ./volumes/iis-postprocessed
        target: /postprocessed
      - type: bind
        source: ./volumes/iis-metadata
        target: /metadata
    command: sh ./scripts/iis-check-progress.sh

  iis-postprocess:
    image: atomgraph/saxon
    platform: linux/amd64
    depends_on:
      iis-prepare-postprocess:
        condition: service_completed_successfully
    volumes:
      - ./volumes/epidoc/stylesheets:/xsl
      - type: bind
        source: ./volumes/iis-output
        target: /output
      - type: bind
        source: ./volumes/iis-postprocessed
        target: /postprocessed
    command: -s:/output -xsl:/xsl/start-txt.xsl -o:/postprocessed
  
  iis-index:
    image: ghcr.io/centrefordigitalhumanities/ianalyzer-indexing:latest
    depends_on:
      iis-postprocess:
        condition: service_completed_successfully
      db:
        condition: service_started
      elasticsearch:
        condition: service_started
    volumes:
      - type: bind
        source: ./volumes/iis-postprocessed
        target: /postprocessed
      - type: bind
        source: ./volumes/iis-output
        target: /output
      - type: bind
        source: ./settings/iis_settings.py
        target: /backend/ianalyzer/settings.py
    command: sh -c "python manage.py migrate && python manage.py loadcorpora && python manage.py index peaceportal-iis -p"
