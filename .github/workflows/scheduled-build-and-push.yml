# This workflow will run every first of the month, to make sure we update the underlying images and libraries
# It will also rebuild every time we have changes in the Dockerfile, directories copied into the image, or in the requirements

name: Build and push dh-scrapers image

on:
    workflow_dispatch:
#    schedule:
#    - cron: "0 0 1 * *"
    push:
      paths:
        - requirements.txt
        - Dockerfile
        - /base-scraper
        - /iis
        - /scripts
        - /utilities

jobs:
    build-scheduled:
        name: Rebuild image
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Build DH scrapers image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/centrefordigitalhumanities/dh-scrapers:latest
            platforms: linux/amd64,linux/arm64

